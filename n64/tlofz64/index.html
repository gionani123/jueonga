<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zelda Ocarina</title>
  <style>
    html, body { 
      margin: 0; 
      height: 100%; 
      background: #000; 
      color: #eee; 
      overflow: hidden; 
    }
    #wrap { display: grid; place-items: center; height: 100vh; width: 100vw; }
    #game { width: 100%; height: 100%; background: #000; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="game"></div>
  </div>

  <script>
    window.EJS_player = "#game";
    window.EJS_core = "n64";
    window.EJS_gameUrl = "https://pub-02e1345ecdc6416c8f29abb18d8cddf8.r2.dev/TLOFZ64.n64?v=2";
    window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
    window.EJS_gameName = "Zelda Ocarina of Time";

    /* --- CONFIGURACIÓN COMPATIBLE CON GITHUB PAGES --- */
    window.EJS_threads = false;             // Desactivado para evitar el error de SharedArrayBuffer
    window.EJS_screenResolution = "native"; // Mantiene resolución nativa para optimizar GPU
    window.EJS_smooth = false;              // Desactiva el suavizado para ganar cuadros por segundo
    window.EJS_virtualGamepad = true;       // Muestra el control táctil en pantallas móviles
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
