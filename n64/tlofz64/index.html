<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zelda Ocarina</title>
  <style>
    html, body { 
      margin: 0; 
      padding: 0;
      background: #000; 
      color: #eee; 
      width: 100%;
      min-height: 100vh;
    }
    #wrap { 
      display: flex; 
      flex-direction: column;
      align-items: center; 
      justify-content: center;
      width: 100%; 
      min-height: 100vh; 
    }
    #game { 
      width: 100%; 
      height: 80vh; /* Deja espacio para mover la pantalla */
      max-width: 960px;
      background: #000; 
    }
    .btn-fullscreen {
      margin: 10px;
      padding: 12px 24px;
      font-size: 16px;
      background: #2196F3;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="game"></div>
    <button class="btn-fullscreen" onclick="EJS_emulator.gameManager.requestFullscreen()">Pantalla Completa</button>
  </div>

  <script>
    window.EJS_player = "#game";
    window.EJS_core = "n64";
    window.EJS_gameUrl = "https://pub-02e1345ecdc6416c8f29abb18d8cddf8.r2.dev/TLOFZ64.n64?v=2";
    window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
    window.EJS_gameName = "Zelda Ocarina of Time";

    /* --- CONFIGURACIÓN --- */
    window.EJS_threads = false;
    window.EJS_screenResolution = "native";
    window.EJS_smooth = false;
    window.EJS_virtualGamepad = true;
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
