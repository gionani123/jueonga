<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>mka64</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body { 
      margin: 0; 
      padding: 0;
      background: #000; 
      color: #eee; 
      width: 100%;
      height: 100dvh; /* Usa dvh en lugar de vh para evitar que la barra de Chrome corte la parte inferior */
      overflow: hidden;
      touch-action: none;
    }
    #wrap { 
      display: flex; 
      flex-direction: column;
      width: 100%; 
      height: 100dvh;
      padding-bottom: 45px; /* Deja margen inferior para evitar la barra de gestos o badges */
    }
    #game { 
      width: 100%; 
      flex: 1;
      min-height: 0; /* Permite que flex encoja el emulador correctamente */
      background: #000; 
      position: relative;
    }
    .btn-fullscreen {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      background: #2196F3;
      color: #fff;
      border: none;
      cursor: pointer;
      font-family: system-ui, sans-serif;
      font-weight: bold;
      z-index: 10;
    }
    /* Evita que el menú de EmulatorJS se corte abajo en pantallas verticales */
    .ejs_menu_bar {
      bottom: 10px !important;
      max-height: 85dvh !important;
      overflow-y: auto !important;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="game"></div>
    <button class="btn-fullscreen" onclick="activarPantallaCompleta()">Pantalla Completa</button>
  </div>

  <script>
    function activarPantallaCompleta() {
      const elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen();
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      }
    }

    window.EJS_player          = "#game";
    window.EJS_core            = "n64";
    window.EJS_gameUrl         = "https://pub-02e1345ecdc6416c8f29abb18d8cddf8.r2.dev/MKART64.z64?v=2";
    window.EJS_pathtodata      = "https://pub-02e1345ecdc6416c8f29abb18d8cddf8.r2.dev/data/";
    window.EJS_gameName        = "Mario Kart";
    window.EJS_backgroundImage = "https://pub-02e1345ecdc6416c8f29abb18d8cddf8.r2.dev/image/n64/image3.png";

    /* --- CONFIGURACIÓN DE RENDIMIENTO --- */
    window.EJS_threads          = false;
    window.EJS_screenResolution = "native";
    window.EJS_smooth           = false;

    /* --- CONTROLES RESPONSIVOS PARA MÓVIL --- */
    window.EJS_virtualGamepad = true;
    window.EJS_gamepadSize    = 0.85;
    window.EJS_gamepadOpacity = 0.7;
  </script>
  
  <script src="https://pub-02e1345ecdc6416c8f29abb18d8cddf8.r2.dev/data/loader.js"></script>
</body>
</html>
